<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="View product details on DEZUBBEX Marketplace">

  <title>Product Details | DEZUBBEX Marketplace</title>

  <link rel="stylesheet" href="product.css">

</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header">
    <div class="container navbar">

      <!-- Logo -->
      <a href="index.html" class="logo">
        DEZUBBEX
      </a>

      <!-- Desktop Navigation -->
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#products">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <!-- Cart -->
      <a href="cart.html" class="cart-link" aria-label="View cart">
        🛒
        <span id="cart-count">0</span>
      </a>

      <!-- Mobile Menu Button -->
      <button
        class="menu-btn"
        id="menu-btn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>

    </div>
  </header>

  <!-- ================= MOBILE NAV ================= -->

  <div class="mobile-nav" id="mobile-nav">
    <a href="index.html">Home</a>
    <a href="index.html#categories">Categories</a>
    <a href="index.html#products">Shop</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </div>

  <!-- ================= PRODUCT DETAILS ================= -->

  <main>

    <section class="product-section">

      <div class="container">

        <!-- Loading -->
        <div id="loading" class="loading" aria-live="polite">
          Loading Product...
        </div>

        <!-- Error -->
        <div id="error-message" class="error-message" aria-live="assertive">
        </div>

        <!-- Product Container (hidden until JS loads data) -->
        <div
          id="product-container"
          class="product-container"
          style="display: none;"
        >

          <!-- Product Image -->
          <div class="product-image-box">
            <img
              id="product-image"
              src=""
              alt="Product image"
              class="product-image"
              loading="lazy"
            >
          </div>

          <!-- Product Information -->
          <div class="product-details">

            <span id="product-category" class="product-category"></span>

            <h1 id="product-title">
              Product Title
            </h1>

            <p id="product-price" class="product-price">
              $0
            </p>

            <p id="product-description" class="product-description"></p>

            <div class="product-actions">

              <button
                id="add-cart-btn"
                class="add-cart-btn"
                type="button"
              >
                Add to Cart
              </button>

              <a href="index.html#products" class="back-btn">
                ← Back to Shop
              </a>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- ================= FOOTER ================= -->

  <footer class="footer">
    <div class="container footer-content">
      <p>
        © 2026 DEZUBBEX Marketplace. All Rights Reserved.
      </p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="product.js" defer></script>

</body>
</html>
